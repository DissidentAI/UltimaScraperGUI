name: Build Windows exe

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # needed to attach files to a GitHub release on tags

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -r requirements.txt
          python -m pip install -r requirements-build.txt

      - name: Version
        id: version
        run: |
          $version = "8.0.0"
          if ("${{ github.ref_type }}" -eq "tag") { $version = "${{ github.ref_name }}".TrimStart("v") }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build folder version (used by the installer)
        run: python -m PyInstaller --noconfirm --clean pyinstaller.spec

      - name: Build single-file portable exe
        env:
          ULTIMA_ONEFILE: "1"
        run: python -m PyInstaller --noconfirm --distpath dist/onefile --workpath build/onefile pyinstaller.spec

      - name: Self-test the executables
        run: |
          foreach ($exe in @("dist\UltimaScraper\UltimaScraper.exe", "dist\onefile\UltimaScraper.exe")) {
            $data = Join-Path $env:RUNNER_TEMP ("selftest-" + [guid]::NewGuid())
            New-Item -ItemType Directory -Path $data | Out-Null
            $env:ULTIMA_DATA_DIR = $data
            $process = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
            Get-Content (Join-Path $data "selftest.log") -ErrorAction SilentlyContinue
            if ($process.ExitCode -ne 0) { throw "$exe self-test failed ($($process.ExitCode))" }
          }

      - name: Install Inno Setup if missing
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build installer
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" installer\UltimaScraper.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Package release files
        run: |
          $v = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist\UltimaScraper-Setup.exe "release\UltimaScraper-$v-Setup.exe"
          Copy-Item dist\onefile\UltimaScraper.exe "release\UltimaScraper-$v-portable.exe"
          # Portable folder: data is kept next to the exe thanks to portable.txt
          Set-Content -Path dist\UltimaScraper\portable.txt -Value "Data (__settings__, __user_data__) is stored in this folder."
          Compress-Archive -Path dist\UltimaScraper -DestinationPath "release\UltimaScraper-$v-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: UltimaScraper-windows-${{ steps.version.outputs.version }}
          path: release/*

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
